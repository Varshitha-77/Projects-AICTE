services:
  - type: web
    name: library-ai-agent-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: IBM_API_KEY
        sync: false
      - key: WATSONX_URL
        value: https://us-south.ml.cloud.ibm.com
      - key: WATSONX_PROJECT_ID
        sync: false
      - key: GRANITE_MODEL_ID
        value: ibm/granite-4-h-small
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_TOKENS
        value: 800
      - key: TEMPERATURE
        value: 0.3
      - key: DB_PATH
        value: ./data/library_db.json
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
